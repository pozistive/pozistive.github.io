<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill Пастельная Страница</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Header (Шапка)</h1>
    </header>

    <nav class="main-nav">
        <ul class="nav-list">
            <li><a href="#link1">Главная</a></li>
            <li><a href="#link2">О нас</a></li>
            <li><a href="#link3">Услуги</a></li>
            <li><a href="#link4">Контакты</a></li>
        </ul>
    </nav>

    <!-- Обертка контейнера, чтобы управлять порядком элементов на мобилках -->
    <div class="content-wrapper">
        
        <!-- Ссылки идут ПЕРВЫМИ в HTML по условию п.3 -->
        <aside class="sidebar-links">
            <h2>Полезные ссылки</h2>
            <ul>
                <li><a href="#">Ресурс 1</a></li>
                <li><a href="#">Ресурс 2</a></li>
                <li><a href="#">Ресурс 3</a></li>
            </ul>
        </aside>

        <!-- Таблица идет ВТОРОЙ в HTML -->
        <main class="main-content">
            <h2>Контентная таблица</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Услуга</th>
                            <th>Стоимость</th>
                            <th>Сроки</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Веб-дизайн</td>
                            <td>15 000 ₽</td>
                            <td>3 дня</td>
                        </tr>
                        <tr>
                            <td>Верстка</td>
                            <td>10 000 ₽</td>
                            <td>2 дня</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>

    <footer class="main-footer">
        <p>Footer (Футер) &copy; 2026. Расслабленный пастельный стиль.</p>
    </footer>

</body>
</html>
